name: Deploy to Self-Hosted

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    - name: Deploy with PM2
      run: |
        # Define deployment path (using current user's home directory)
        DEPLOY_PATH="$HOME/Projects/dffinity-sa-char-viewer"
        
        # Create directory if it doesn't exist
        mkdir -p "$DEPLOY_PATH"
        
        # Copy build artifacts to the persistent location
        # Remove old dist to ensure clean state, then move new dist
        rm -rf "$DEPLOY_PATH/dist"
        cp -r dist "$DEPLOY_PATH/"
        
        # Install PM2 globally if not already installed
        npm install -g pm2
        
        # Navigate to the deployment path to ensure PM2 commands run from there
        cd "$DEPLOY_PATH"
        
        # Check if the process is already running
        if pm2 describe dffinity-viewer > /dev/null; then
          echo "Process found, reloading..."
          pm2 reload dffinity-viewer
        else
          echo "Process not found, starting..."
          # Serve the 'dist' folder on port 8080 in SPA mode
          pm2 serve dist 8080 --spa --name "dffinity-viewer"
        fi
        
        # Save the current process list
        pm2 save
