name: Deploy to Self-Hosted

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    - name: Deploy with PM2
      run: |
        # Install PM2 globally if not already installed (optional, assuming it is since other apps are running)
        npm install -g pm2
        
        # Check if the process is already running
        if pm2 describe dffinity-viewer > /dev/null; then
          echo "Process found, reloading..."
          pm2 reload dffinity-viewer
        else
          echo "Process not found, starting..."
          # Serve the 'dist' folder on port 8080 in SPA mode
          pm2 serve dist 8080 --spa --name "dffinity-viewer"
        fi
        
        # Save the current process list
        pm2 save